<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudplusAI API Keys</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#050816;color:#f8fafc}.wrap{max-width:950px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.back{color:#67e8f9;text-decoration:none}.card{background:#0d1527;border:1px solid #1e293b;border-radius:18px;padding:22px;margin-bottom:16px}.muted{color:#94a3b8;font-size:13px}.create{display:flex;gap:10px;margin-top:18px}.input{flex:1;padding:12px;border:1px solid #26344d;border-radius:10px;background:#080d1b;color:#fff}.btn{padding:12px 16px;border:0;border-radius:10px;background:#67e8f9;color:#06111a;font-weight:800;cursor:pointer}.key{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #1e293b}.key:last-child{border:0}.revoke{border:1px solid #7f1d1d;background:#2a1015;color:#fda4af;padding:8px 11px;border-radius:9px;cursor:pointer}.secret{font-family:monospace;color:#cbd5e1;margin-top:4px}@media(max-width:600px){.create{display:grid}.key{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>API Keys</h1><div class="muted">Create and manage developer access keys.</div></div><a class="back" href="dashboard.html">← Dashboard</a></div><section class="card"><h2>Create API key</h2><div class="muted">Keep generated secrets private. Never commit them to GitHub.</div><div class="create"><input class="input" id="name" placeholder="Key name, e.g. Production App"><button class="btn" onclick="createKey()">Create key</button></div><div id="result"></div></section><section class="card"><h2>Your keys</h2><div id="list" class="muted">Loading…</div></section></main><script>const token=localStorage.getItem('cloudplusai_token');const headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});async function load(){if(!token){location.href='auth.html';return}try{const r=await fetch('/api/keys',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message);list.innerHTML=d.keys.length?d.keys.map(k=>'<div class="key"><div><strong>'+esc(k.name)+'</strong><div class="secret">'+esc(k.maskedKey)+'</div><div class="muted">Created '+new Date(k.createdAt).toLocaleString()+'</div></div><button class="revoke" onclick="revokeKey(\''+k.id+'\')">Revoke</button></div>').join(''):'No API keys yet.'}catch(e){list.textContent=e.message||'Unable to load keys.'}}async function createKey(){const nameEl=document.getElementById('name'),name=nameEl.value.trim()||'My API Key';result.textContent='Creating…';try{const r=await fetch('/api/keys',{method:'POST',headers:headers(),body:JSON.stringify({name})});const d=await r.json();if(!r.ok)throw Error(d.message);result.innerHTML='<div class="secret" style="margin-top:14px">Copy this key now: '+esc(d.key)+'<br>It will not be shown again.</div>';nameEl.value='';load()}catch(e){result.textContent=e.message||'Unable to create key.'}}async function revokeKey(id){if(!confirm('Revoke this API key?'))return;await fetch('/api/keys/'+id,{method:'DELETE',headers:headers()});load()}function esc(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();</script></body></html>
