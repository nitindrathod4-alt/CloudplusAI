<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudplusAI — Sign in</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#050816;color:#f8fafc}.box{width:min(430px,92vw);padding:30px;border:1px solid #1e293b;border-radius:24px;background:#0b1222;box-shadow:0 25px 80px #0008}.brand{text-align:center;font-size:25px;font-weight:900;margin-bottom:8px}.brand b{color:#67e8f9}.sub{text-align:center;color:#94a3b8;margin-bottom:26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tabs button{border:1px solid #26344d;background:#101827;color:#94a3b8;padding:11px;border-radius:11px;cursor:pointer}.tabs .active{color:#fff;border-color:#67e8f9;background:#152238}label{display:block;color:#cbd5e1;font-size:13px;margin:13px 0 7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #26344d;background:#070d1b;color:#fff;outline:0}input:focus{border-color:#67e8f9}.submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#67e8f9;color:#06111a;font-weight:800;cursor:pointer}.msg{text-align:center;min-height:20px;margin-top:14px;font-size:13px;color:#fda4af}.back{display:block;text-align:center;margin-top:20px;color:#94a3b8;text-decoration:none;font-size:13px}</style></head><body><main class="box"><div class="brand">✦ <b>Cloudplus</b>AI</div><div class="sub">Your personal AI workspace</div><div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">Sign in</button><button id="registerTab" onclick="mode('register')">Create account</button></div><form onsubmit="submitAuth(event)"><div id="nameWrap" style="display:none"><label>Name</label><input id="name" autocomplete="name"></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><button class="submit" id="submit">Sign in</button></form><div class="msg" id="msg"></div><a class="back" href="index.html">← Back to CloudplusAI</a></main><script>let current='login';function mode(x){current=x;nameWrap.style.display=x==='register'?'block':'none';loginTab.classList.toggle('active',x==='login');registerTab.classList.toggle('active',x==='register');submit.textContent=x==='register'?'Create account':'Sign in';msg.textContent=''}async function submitAuth(e){e.preventDefault();msg.textContent='';submit.disabled=true;const body={email:email.value,password:password.value};if(current==='register')body.name=name.value;try{const r=await fetch('/api/auth/'+current,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.message||'Authentication failed');localStorage.setItem('cloudplusai_token',data.token);location.href='dashboard.html'}catch(err){msg.textContent=err.message}finally{submit.disabled=false}}</script></body></html>
