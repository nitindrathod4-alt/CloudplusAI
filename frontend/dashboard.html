<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudplusAI Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#050816;color:#f8fafc}button{font:inherit}.layout{display:flex;min-height:100vh}.side{width:250px;padding:22px 16px;border-right:1px solid #1e293b;background:#080d1d}.brand{font-weight:900;font-size:20px;padding:8px 12px 28px}.brand b{color:#67e8f9}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;padding:12px 14px;border-radius:12px;background:transparent;color:#94a3b8;cursor:pointer}.nav button.active,.nav button:hover{background:#172033;color:#fff}.bottom{margin-top:auto}.main{flex:1;padding:30px;max-width:1250px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{margin:0;font-size:30px}.profile{border:1px solid #253149;background:#101827;color:#fff;padding:10px 14px;border-radius:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0d1527;border:1px solid #1e293b;border-radius:18px;padding:20px}.label{color:#94a3b8;font-size:13px}.value{font-size:28px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{background:#0d1527;border:1px solid #1e293b;border-radius:18px;padding:22px}.panel h2{font-size:17px;margin:0 0 18px}.chat{height:260px;display:flex;align-items:center;justify-content:center;color:#64748b;text-align:center}.actions{display:grid;gap:10px}.action{padding:14px;border:1px solid #26344d;border-radius:12px;background:#111b2e;color:#cbd5e1;text-align:left}.action:hover{border-color:#67e8f9}.status{display:flex;align-items:center;gap:8px;color:#86efac;font-size:13px}.dot{width:8px;height:8px;background:#34d399;border-radius:50%}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}.side{width:100%;border-right:0;border-bottom:1px solid #1e293b}.nav{display:flex;overflow:auto}.main{padding:18px}.cards{grid-template-columns:1fr 1fr}.top h1{font-size:23px}}
