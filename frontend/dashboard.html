<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudplusAI Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#050816;color:#f8fafc}button{font:inherit}.layout{display:flex;min-height:100vh}.side{width:250px;padding:22px 16px;border-right:1px solid #1e293b;background:#080d1d;display:flex;flex-direction:column}.brand{font-weight:900;font-size:20px;padding:8px 12px 28px}.brand b{color:#67e8f9}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;padding:12px 14px;border-radius:12px;background:transparent;color:#94a3b8;cursor:pointer}.nav button.active,.nav button:hover{background:#172033;color:#fff}.bottom{margin-top:auto}.main{flex:1;padding:30px;max-width:1250px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{margin:0;font-size:30px}.profile{border:1px solid #253149;background:#101827;color:#fff;padding:10px 14px;border-radius:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0d1527;border:1px solid #1e293b;border-radius:18px;padding:20px}.label{color:#94a3b8;font-size:13px}.value{font-size:28px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{background:#0d1527;border:1px solid #1e293b;border-radius:18px;padding:22px}.panel h2{font-size:17px;margin:0 0 18px}.chat{min-height:260px;color:#64748b}.conv{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #172235}.conv:last-child{border-bottom:0}.conv strong{font-size:14px}.conv small{display:block;color:#64748b;margin-top:4px}.actions{display:grid;gap:10px}.action{padding:14px;border:1px solid #26344d;border-radius:12px;background:#111b2e;color:#cbd5e1;text-align:left;cursor:pointer}.action:hover{border-color:#67e8f9}.status{display:flex;align-items:center;gap:8px;color:#86efac;font-size:13px;margin-top:8px}.dot{width:8px;height:8px;background:#34d399;border-radius:50%}.empty{padding:70px 10px;text-align:center}.empty b{display:block;color:#cbd5e1;margin-bottom:8px}.empty span{font-size:13px}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}.side{width:100%;border-right:0;border-bottom:1px solid #1e293b}.nav{display:flex;overflow:auto}.bottom{display:none}.main{padding:18px}.cards{grid-template-columns:1fr 1fr}.top h1{font-size:23px}}</style></head><body><div class="layout"><aside class="side"><div class="brand">✦ <b>Cloudplus</b>AI</div><div class="nav"><button class="active">⌂ Dashboard</button><button onclick="location.href='index.html'">＋ New Chat</button><button>◷ Chat History</button><button>▣ Usage</button><button onclick="location.href='settings.html'">⚙ Settings</button><button>⌘ API Keys</button></div><div class="nav bottom"><button onclick="logout()">↪ Logout</button></div></aside><main class="main"><div class="top"><h1 id="greeting">Good to see you 👋</h1><div class="profile" id="profile">Account</div></div><div class="cards"><div class="card"><div class="label">Total Chats</div><div class="value" id="chats">—</div></div><div class="card"><div class="label">Messages</div><div class="value" id="messages">—</div></div><div class="card"><div class="label">API Requests</div><div class="value" id="requests">—</div></div><div class="card"><div class="label">System</div><div class="status"><i class="dot"></i> Online</div></div></div><div class="grid"><section class="panel"><h2>Recent conversations</h2><div class="chat" id="conversationList"><div class="empty"><b>Loading conversations…</b><span>Your saved chats will appear here.</span></div></div></section><section class="panel"><h2>Quick actions</h2><div class="actions"><button class="action" onclick="location.href='index.html'">＋ Start a new AI chat</button><button class="action">▣ View usage analytics</button><button class="action" onclick="location.href='settings.html'">⚙ Open settings</button><button class="action">⌘ Manage API keys</button></div></section></div></main></div><script>const token=localStorage.getItem('cloudplusai_token');async function load(){if(!token){location.href='auth.html';return}const h={Authorization:'Bearer '+token};try{const [me,u,c]=await Promise.all([fetch('/api/me',{headers:h}),fetch('/api/usage',{headers:h}),fetch('/api/conversations',{headers:h})]);if(!me.ok||!u.ok||!c.ok)throw new Error('API error');const user=await me.json(),usage=await u.json(),data=await c.json();document.getElementById('profile').textContent=(user.user?.name||'Account')+' ▾';document.getElementById('greeting').textContent='Good to see you, '+(user.user?.name||'there')+' 👋';document.getElementById('chats').textContent=usage.chats??0;document.getElementById('messages').textContent=usage.messages??0;document.getElementById('requests').textContent=usage.usage?.requests??0;const list=document.getElementById('conversationList');if(!data.conversations?.length){list.innerHTML='<div class="empty"><b>No conversations yet</b><span>Start your first AI chat.</span></div>';return}list.innerHTML=data.conversations.slice(0,8).map(x=>'<div class="conv"><div><strong>'+escapeHtml(x.title)+'</strong><small>'+new Date(x.updatedAt).toLocaleString()+'</small></div></div>').join('')}catch(e){localStorage.removeItem('cloudplusai_token');location.href='auth.html'}}function escapeHtml(s){return String(s).replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function logout(){localStorage.removeItem('cloudplusai_token');location.href='auth.html'}load();</script></body></html>
