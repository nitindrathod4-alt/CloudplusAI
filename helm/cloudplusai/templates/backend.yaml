apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudplusai.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cloudplusai.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "cloudplusai.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudplusai.fullname" . }}-backend
spec:
  selector:
    app: {{ include "cloudplusai.fullname" . }}-backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
