<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 822" role="img" aria-label="CloudplusAI • Terraform AWS Infrastructure">
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.title{font:700 30px Arial,sans-serif;fill:#fff}.label{font:700 18px Arial,sans-serif;fill:#fff}.sub{font:500 13px Arial,sans-serif;fill:#94a3b8}.node{fill:#0f172a;stroke:#64748b;stroke-width:2}.flow{fill:none;stroke:url(#line);stroke-width:6;stroke-linecap:round;stroke-dasharray:18 14;animation:move 1.1s linear infinite}.dot{fill:#fff;filter:url(#glow);animation:pulse 1.2s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-64}}@keyframes pulse{50%{r:10;opacity:.35}}</style>
</defs><rect width="900" height="822" rx="28" fill="url(#bg)"/>
<text x="450" y="48" text-anchor="middle" class="title">CloudplusAI • Terraform AWS Infrastructure</text>
<text x="450" y="73" text-anchor="middle" class="sub">Vertical animated flow • continuous delivery path</text><path d="M 450 146 L 450 172" class="flow"/><circle cx="450" cy="159" r="7" class="dot"/><rect x="190" y="94" width="520" height="52" rx="14" class="node"/><text x="450" y="127" text-anchor="middle" class="label">Terraform</text><path d="M 450 224 L 450 250" class="flow"/><circle cx="450" cy="237" r="7" class="dot"/><rect x="190" y="172" width="520" height="52" rx="14" class="node"/><text x="450" y="205" text-anchor="middle" class="label">VPC + Networking</text><path d="M 450 302 L 450 328" class="flow"/><circle cx="450" cy="315" r="7" class="dot"/><rect x="190" y="250" width="520" height="52" rx="14" class="node"/><text x="450" y="283" text-anchor="middle" class="label">IAM</text><path d="M 450 380 L 450 406" class="flow"/><circle cx="450" cy="393" r="7" class="dot"/><rect x="190" y="328" width="520" height="52" rx="14" class="node"/><text x="450" y="361" text-anchor="middle" class="label">EC2</text><path d="M 450 458 L 450 484" class="flow"/><circle cx="450" cy="471" r="7" class="dot"/><rect x="190" y="406" width="520" height="52" rx="14" class="node"/><text x="450" y="439" text-anchor="middle" class="label">EKS</text><path d="M 450 536 L 450 562" class="flow"/><circle cx="450" cy="549" r="7" class="dot"/><rect x="190" y="484" width="520" height="52" rx="14" class="node"/><text x="450" y="517" text-anchor="middle" class="label">ECR</text><path d="M 450 614 L 450 640" class="flow"/><circle cx="450" cy="627" r="7" class="dot"/><rect x="190" y="562" width="520" height="52" rx="14" class="node"/><text x="450" y="595" text-anchor="middle" class="label">ALB</text><path d="M 450 692 L 450 718" class="flow"/><circle cx="450" cy="705" r="7" class="dot"/><rect x="190" y="640" width="520" height="52" rx="14" class="node"/><text x="450" y="673" text-anchor="middle" class="label">S3 / RDS</text><rect x="190" y="718" width="520" height="52" rx="14" class="node"/><text x="450" y="751" text-anchor="middle" class="label">CloudWatch</text></svg>