<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="CloudplusAI animated AWS DevOps flow">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#fff}
    .label{font:700 20px Arial,sans-serif;fill:#fff}
    .sub{font:500 15px Arial,sans-serif;fill:#cbd5e1}
    .node{fill:#0f172a;stroke:#64748b;stroke-width:2}
    .flow{fill:none;stroke:url(#line);stroke-width:5;stroke-linecap:round;stroke-dasharray:18 14;animation:move 1.2s linear infinite}
    .flow2{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 18;animation:move 1.8s linear infinite}
    .dot{fill:#fff;filter:url(#glow);animation:pulse 1.4s ease-in-out infinite}
    @keyframes move{to{stroke-dashoffset:-64}}
    @keyframes pulse{50%{r:9;opacity:.45}}
  </style>
</defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<text x="700" y="58" text-anchor="middle" class="title">⚡ CloudplusAI • Animated DevOps &amp; AWS Flow</text>
<text x="700" y="88" text-anchor="middle" class="sub">GitHub → CI/CD → Docker → Kubernetes/EKS → Flux CD → AWS</text>

<g>
<rect x="70" y="150" width="190" height="90" rx="18" class="node"/><text x="165" y="190" text-anchor="middle" class="label">🐙 GitHub</text><text x="165" y="216" text-anchor="middle" class="sub">Source Control</text>
<rect x="350" y="150" width="190" height="90" rx="18" class="node"/><text x="445" y="190" text-anchor="middle" class="label">🔧 Jenkins</text><text x="445" y="216" text-anchor="middle" class="sub">CI Pipeline</text>
<rect x="630" y="150" width="190" height="90" rx="18" class="node"/><text x="725" y="190" text-anchor="middle" class="label">🚀 GitHub Actions</text><text x="725" y="216" text-anchor="middle" class="sub">CI/CD Automation</text>
<rect x="910" y="150" width="190" height="90" rx="18" class="node"/><text x="1005" y="190" text-anchor="middle" class="label">🐳 Docker</text><text x="1005" y="216" text-anchor="middle" class="sub">Build &amp; Image</text>
<path d="M260 195H350M540 195H630M820 195H910" class="flow"/><circle cx="300" cy="195" r="7" class="dot"/><circle cx="580" cy="195" r="7" class="dot"/><circle cx="860" cy="195" r="7" class="dot"/>
</g>

<rect x="520" y="315" width="360" height="100" rx="20" class="node"/><text x="700" y="355" text-anchor="middle" class="label">☸️ Kubernetes / Amazon EKS</text><text x="700" y="382" text-anchor="middle" class="sub">Orchestration • Scaling • Services</text>
<path d="M1005 240V280H700V315" class="flow"/><circle cx="850" cy="280" r="8" class="dot"/>

<rect x="570" y="470" width="260" height="82" rx="18" class="node"/><text x="700" y="504" text-anchor="middle" class="label">🔄 Flux CD</text><text x="700" y="530" text-anchor="middle" class="sub">GitOps Continuous Delivery</text>
<path d="M700 415V470" class="flow"/><circle cx="700" cy="445" r="8" class="dot"/>

<g>
<rect x="80" y="625" width="180" height="78" rx="16" class="node"/><text x="170" y="658" text-anchor="middle" class="label">☁️ EC2</text><text x="170" y="683" text-anchor="middle" class="sub">Compute</text>
<rect x="300" y="625" width="180" height="78" rx="16" class="node"/><text x="390" y="658" text-anchor="middle" class="label">📦 ECR</text><text x="390" y="683" text-anchor="middle" class="sub">Container Registry</text>
<rect x="520" y="625" width="180" height="78" rx="16" class="node"/><text x="610" y="658" text-anchor="middle" class="label">🌐 VPC</text><text x="610" y="683" text-anchor="middle" class="sub">Networking</text>
<rect x="740" y="625" width="180" height="78" rx="16" class="node"/><text x="830" y="658" text-anchor="middle" class="label">🗄️ RDS / S3</text><text x="830" y="683" text-anchor="middle" class="sub">Data &amp; Storage</text>
<rect x="960" y="625" width="180" height="78" rx="16" class="node"/><text x="1050" y="658" text-anchor="middle" class="label">📈 CloudWatch</text><text x="1050" y="683" text-anchor="middle" class="sub">Monitoring</text>
<rect x="1180" y="625" width="150" height="78" rx="16" class="node"/><text x="1255" y="658" text-anchor="middle" class="label">🔐 IAM</text><text x="1255" y="683" text-anchor="middle" class="sub">Security</text>
<path d="M700 552V590H170V625M700 590H390V625M700 590H610V625M700 590H830V625M700 590H1050V625M700 590H1255V625" class="flow2"/>
</g>
</svg>