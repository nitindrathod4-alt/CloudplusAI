<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-label="CloudplusAI Monitoring Flow">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070b1a"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
.title{font:700 28px Arial,sans-serif;fill:#fff}.label{font:700 17px Arial,sans-serif;fill:#fff}.sub{font:500 12px Arial,sans-serif;fill:#94a3b8}.node{fill:#0f172a;stroke:#64748b;stroke-width:2}.flow{fill:none;stroke:url(#line);stroke-width:5;stroke-linecap:round;stroke-dasharray:18 14;animation:move 1.2s linear infinite}.dot{fill:#fff;filter:url(#glow);animation:pulse 1.4s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-64}}@keyframes pulse{50%{r:10;opacity:.4}}</style></defs>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/><text x="700" y="55" text-anchor="middle" class="title">CloudplusAI Monitoring Flow</text><path d="M165 210H255" class="flow"/><circle cx="210" cy="210" r="8" class="dot"/><path d="M405 210H495" class="flow"/><circle cx="450" cy="210" r="8" class="dot"/><path d="M645 210H735" class="flow"/><circle cx="690" cy="210" r="8" class="dot"/><path d="M885 210H975" class="flow"/><circle cx="930" cy="210" r="8" class="dot"/><g><rect x="15" y="168" width="150" height="84" rx="18" class="node"/><text x="90" y="205" text-anchor="middle" class="label">☸️ Application / Pods</text><text x="90" y="230" text-anchor="middle" class="sub">START</text></g><g><rect x="255" y="168" width="150" height="84" rx="18" class="node"/><text x="330" y="205" text-anchor="middle" class="label">📡 /metrics</text><text x="330" y="230" text-anchor="middle" class="sub">STEP</text></g><g><rect x="495" y="168" width="150" height="84" rx="18" class="node"/><text x="570" y="205" text-anchor="middle" class="label">🔥 Prometheus</text><text x="570" y="230" text-anchor="middle" class="sub">STEP</text></g><g><rect x="735" y="168" width="150" height="84" rx="18" class="node"/><text x="810" y="205" text-anchor="middle" class="label">📊 Grafana</text><text x="810" y="230" text-anchor="middle" class="sub">STEP</text></g><g><rect x="975" y="168" width="150" height="84" rx="18" class="node"/><text x="1050" y="205" text-anchor="middle" class="label">☁️ CloudWatch</text><text x="1050" y="230" text-anchor="middle" class="sub">TARGET</text></g></svg>