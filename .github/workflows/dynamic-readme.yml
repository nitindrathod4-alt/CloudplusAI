name: Dynamic README Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live frontend
        id: live
        run: |
          if curl -fsSL --max-time 20 https://cloudplusai.dreamapexai.online >/dev/null; then
            echo "status=🟢 Online" >> "$GITHUB_OUTPUT"
          else
            echo "status=🔴 Check failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dynamic README block
        env:
          LIVE_STATUS: ${{ steps.live.outputs.status }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          start = "<!-- DYNAMIC_STATUS:START -->"
          end = "<!-- DYNAMIC_STATUS:END -->"

          block = f"""<!-- DYNAMIC_STATUS:START -->
          | Service | Live Status |
          |---|---|
          | 🌐 Frontend | {__import__('os').environ['LIVE_STATUS']} |
          | 🔄 CI | [![CI](https://img.shields.io/github/actions/workflow/status/nitindrathod4-alt/CloudplusAI/ci.yml?branch=main&style=flat-square)](https://github.com/nitindrathod4-alt/CloudplusAI/actions/workflows/ci.yml) |
          | 🤖 AI Model | `openai/gpt-oss-20b` |
          | 🕒 Last automatic check | {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")} |
          <!-- DYNAMIC_STATUS:END -->"""

          a = text.index(start)
          b = text.index(end) + len(end)
          a = text.index(start)
          b = text.index(end) + len(end)
          text = text[:a] + block + text[b:]

          s = "<!-- DYNAMIC_STRUCTURE:START -->"
          e = "<!-- DYNAMIC_STRUCTURE:END -->"
          excluded = {'.git', 'node_modules', '.terraform', '.vercel'}
          lines = ['CloudplusAI/']
          def walk(parent, prefix=''):
              children = sorted([p for p in parent.iterdir() if p.name not in excluded], key=lambda p: (p.is_file(), p.name.lower()))
              for i, p in enumerate(children):
                  last = i == len(children) - 1
                  lines.append(prefix + ('└── ' if last else '├── ') + p.name + ('/' if p.is_dir() else ''))
                  if p.is_dir(): walk(p, prefix + ('    ' if last else '│   '))
          walk(Path('.'))
          structure = s + '\n```text\n' + '\n'.join(lines) + '\n```\n' + e
          a = text.index(s)
          b = text.index(e) + len(e)
          path.write_text(text[:a] + structure + text[b:], encoding='utf-8')

          # Keep the application flow synchronized with the current backend/frontend stack.
          fs = "<!-- DYNAMIC_USER_FLOW:START -->"
          fe = "<!-- DYNAMIC_USER_FLOW:END -->"
          flow = """<!-- DYNAMIC_USER_FLOW:START -->
          ```text
          👤 User
             ↓
          🖥️ CloudplusAI UI
             ↓
          🔐 Authentication / API Key
             ↓
          🛡️ Rate Limiter + Request Validation
             ↓
          ⚙️ Express API
             ├──→ 🗄️ MongoDB
             ├──→ 🤖 AI Provider
             └──→ 📊 Analytics
          <!-- DYNAMIC_USER_FLOW:END -->"""
          a = text.index(fs)
          b = text.index(fe) + len(fe)
          text = text[:a] + flow + text[b:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh dynamic README status"
          git push
