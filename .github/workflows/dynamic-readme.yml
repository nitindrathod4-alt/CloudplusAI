name: Dynamic README Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live frontend
        id: live
        run: |
          if curl -fsSL --max-time 20 https://cloudplusai.dreamapexai.online >/dev/null; then
            echo "status=🟢 Online" >> "$GITHUB_OUTPUT"
          else
            echo "status=🔴 Check failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dynamic README block
        env:
          LIVE_STATUS: ${{ steps.live.outputs.status }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          start = "<!-- DYNAMIC_STATUS:START -->"
          end = "<!-- DYNAMIC_STATUS:END -->"

          block = f"""<!-- DYNAMIC_STATUS:START -->
          | Service | Live Status |
          |---|---|
          | 🌐 Frontend | {__import__('os').environ['LIVE_STATUS']} |
          | 🔄 CI | [![CI](https://img.shields.io/github/actions/workflow/status/nitindrathod4-alt/CloudplusAI/ci.yml?branch=main&style=flat-square)](https://github.com/nitindrathod4-alt/CloudplusAI/actions/workflows/ci.yml) |
          | 🤖 AI Model | `openai/gpt-oss-20b` |
          | 🕒 Last automatic check | {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")} |
          <!-- DYNAMIC_STATUS:END -->"""

          a = text.index(start)
          b = text.index(end) + len(end)
          a = text.index(start)
          b = text.index(end) + len(end)
          text = text[:a] + block + text[b:]

          s = "<!-- DYNAMIC_STRUCTURE:START -->"
          e = "<!-- DYNAMIC_STRUCTURE:END -->"
          excluded = {'.git', 'node_modules', '.terraform', '.vercel', 'vercel.json'}
          lines = ['CloudplusAI/']
          def walk(parent, prefix=''):
              children = sorted([p for p in parent.iterdir() if p.name not in excluded], key=lambda p: (p.is_file(), p.name.lower()))
              for i, p in enumerate(children):
                  last = i == len(children) - 1
                  lines.append(prefix + ('└── ' if last else '├── ') + p.name + ('/' if p.is_dir() else ''))
                  if p.is_dir(): walk(p, prefix + ('    ' if last else '│   '))
          walk(Path('.'))
          structure = s + '\n```text\n' + '\n'.join(lines) + '\n```\n' + e
          a = text.index(s)
          b = text.index(e) + len(e)
          path.write_text(text[:a] + structure + text[b:], encoding='utf-8')

          # Generate the main User → Application flow from the actual repository.
          # The diagram changes automatically when detected application capabilities change.
          import html
          from pathlib import Path
          backend = Path("backend/server.js").read_text(encoding="utf-8") if Path("backend/server.js").exists() else ""
          frontend_files = list(Path("frontend").glob("*.html")) if Path("frontend").exists() else []
          nodes = ["👤 User"]
          if any("auth" in p.name.lower() for p in frontend_files) or "/api/auth/" in backend:
              nodes.append("🔐 Authentication")
          if "api-keys" in "".join(p.name.lower() for p in frontend_files) or "api/key" in backend.lower():
              nodes.append("🔑 API Key Management")
          nodes.append("🖥️ CloudplusAI Application")
          if "rate" in backend.lower() or "limit" in backend.lower():
              nodes.append("🛡️ Request Validation + Rate Limiting")
          nodes.append("⚙️ Express API")
          if "mongoose" in backend.lower() or "mongodb" in backend.lower():
              nodes.append("🗄️ MongoDB")
          if "groq" in backend.lower():
              model = "openai/gpt-oss-20b" if "gpt-oss-20b" in backend.lower() else "Configured AI Model"
              nodes.append("🤖 Groq API → " + model)
          if "usage" in backend.lower() or "analytics" in backend.lower():
              nodes.append("📊 Usage & Analytics")

          svg_path = Path("docs/images/user-application-flow.svg")
          W, start, gap = 900, 120, 78
          H = max(520, start + (len(nodes)-1)*gap + 80)
          def esc(x): return html.escape(x)
          boxes = []
          for i, node in enumerate(nodes):
              y = start + i*gap
              if i:
                  boxes.append(f'<path d="M 450 {y-52} L 450 {y-26}" class="flow"/><circle cx="450" cy="{y-39}" r="7" class="dot"/>')
              boxes.append(f'<rect x="190" y="{y-26}" width="520" height="52" rx="14" class="node"/><text x="450" y="{y+7}" text-anchor="middle" class="label">{esc(node)}</text>')
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" role="img" aria-label="CloudplusAI dynamic User to Application Flow">
          <defs>
          <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#111827"/></linearGradient>
          <linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <style>.title{{font:700 30px Arial,sans-serif;fill:#fff}}.label{{font:700 18px Arial,sans-serif;fill:#fff}}.sub{{font:500 13px Arial,sans-serif;fill:#94a3b8}}.node{{fill:#0f172a;stroke:#64748b;stroke-width:2}}.flow{{fill:none;stroke:url(#line);stroke-width:6;stroke-linecap:round;stroke-dasharray:18 14;animation:move 1.1s linear infinite}}.dot{{fill:#fff;filter:url(#glow);animation:pulse 1.2s ease-in-out infinite}}@keyframes move{{to{{stroke-dashoffset:-64}}}}@keyframes pulse{{50%{{r:10;opacity:.35}}}}</style>
          </defs>
          <rect width="{W}" height="{H}" rx="28" fill="url(#bg)"/>
          <text x="450" y="48" text-anchor="middle" class="title">CloudplusAI • Dynamic User → Application Flow</text>
          <text x="450" y="73" text-anchor="middle" class="sub">Generated from the current frontend and backend capabilities</text>
          {''.join(boxes)}
          </svg>'''
          svg_path.write_text(svg, encoding="utf-8")

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh dynamic README status"
          git push
