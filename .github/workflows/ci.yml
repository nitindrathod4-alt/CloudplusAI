name: CloudplusAI CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify backend package
        working-directory: backend
        run: |
          test -f package.json
          node -e "const p=require('./package.json'); console.log('Backend package:', p.name || 'CloudplusAI backend')"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Check backend syntax
        working-directory: backend
        run: |
          node --check server.js
          if [ -f api-v1.js ]; then node --check api-v1.js; fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/dashboard.html
          test -f frontend/auth.html
          test -f frontend/settings.html
          test -f frontend/api-keys.html
