name: CloudplusAI DevOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: cloudplusai-backend

jobs:
  validate:
    name: Validate + Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Backend syntax check
        working-directory: backend
        run: |
          node --check server.js
          test ! -f api-v1.js || node --check api-v1.js

      - name: Build backend image
        run: docker build -t $IMAGE_NAME:ci ./backend

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  sonar:
    name: SonarQube (when configured)
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run SonarQube scan
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: Skip SonarQube when credentials are not configured
        if: ${{ env.SONAR_HOST_URL == '' || env.SONAR_TOKEN == '' }}
        run: echo "SonarQube secrets are not configured; scan skipped."

  docker-publish:
    name: Publish to Amazon ECR (when AWS is configured)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip ECR when AWS secrets are not configured
        if: ${{ env.AWS_ROLE_ARN == '' || env.AWS_REGION == '' || env.ECR_REPOSITORY == '' }}
        run: echo "AWS/ECR secrets are not configured; publish skipped."
      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_ARN != '' && env.AWS_REGION != '' && env.ECR_REPOSITORY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        if: ${{ env.AWS_ROLE_ARN != '' && env.AWS_REGION != '' && env.ECR_REPOSITORY != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        if: ${{ env.AWS_ROLE_ARN != '' && env.AWS_REGION != '' && env.ECR_REPOSITORY != '' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./backend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
