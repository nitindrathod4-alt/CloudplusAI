name: CloudplusAI Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend image
        run: docker build -t cloudplusai-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cloudplusai-frontend:${{ github.sha }} ./frontend

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Scan backend image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL cloudplusai-backend:${{ github.sha }}

      - name: Scan frontend image
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL cloudplusai-frontend:${{ github.sha }}

  deploy:
    needs: build-and-scan
    if: ${{ vars.EKS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Deploy with Helm
        run: helm upgrade --install cloudplusai ./helm/cloudplusai --namespace cloudplusai --create-namespace --wait
