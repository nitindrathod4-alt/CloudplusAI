apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudplusai-backend
  namespace: cloudplusai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudplusai-backend
  template:
    metadata:
      labels:
        app: cloudplusai-backend
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_ECR_BACKEND_IMAGE
          ports:
            - containerPort: 5000
          env:
            - name: MONGODB_URI
              value: mongodb://cloudplusai-mongodb:27017/cloudplusai
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloudplusai-backend
  namespace: cloudplusai
spec:
  selector:
    app: cloudplusai-backend
  ports:
    - port: 5000
      targetPort: 5000
