apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudplusai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: cloudplusai-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['cloudplusai-backend.cloudplusai.svc.cluster.local:5000']
