apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudplusai-mongodb
  namespace: cloudplusai
spec:
  serviceName: cloudplusai-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: cloudplusai-mongodb
  template:
    metadata:
      labels:
        app: cloudplusai-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudplusai-mongodb
  namespace: cloudplusai
spec:
  clusterIP: None
  selector:
    app: cloudplusai-mongodb
  ports:
    - port: 27017
      targetPort: 27017
